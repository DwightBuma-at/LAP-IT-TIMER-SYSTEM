<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAP IT | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lap: {
              purple: '#3B178F',
              dark: '#27105F',
              light: '#EEE9FA',
              ink: '#050505',
              muted: '#68636C',
              line: '#DED9E0'
            }
          },
          fontFamily: {
            display: ['Barlow Condensed', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #F7F5F7;
      color: #050505;
    }

    .login-visual {
      background:
        linear-gradient(135deg, rgba(15, 8, 42, .84), rgba(59, 23, 143, .68)),
        url("assets/billiards.png") center/cover;
    }

    .login-primary {
      background: #3B178F;
      color: #FFFFFF !important;
    }

    .login-primary:hover {
      background: #27105F;
    }

    .login-secondary:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
    }
  </style>
</head>
<body>
  <main class="login-visual flex min-h-screen items-center justify-center px-5 py-8 sm:px-8">
    <section class="w-full max-w-md">
      <div class="w-full max-w-md">
        <div class="mb-8 flex items-center justify-between">
          <a href="index.html" aria-label="Back to LAP IT home">
            <img src="assets/lap_it_logo-removebg-preview.png" alt="LAP IT logo" class="h-14 w-36 object-contain object-left">
          </a>
          <a class="login-secondary inline-flex h-10 items-center justify-center rounded-xl border border-white/30 bg-white/90 px-4 text-sm font-bold text-lap-ink transition" href="index.html">Home</a>
        </div>

        <div class="rounded-2xl border border-lap-line bg-white p-6 shadow-[0_24px_60px_rgba(39,16,95,.10)] sm:p-8">
          <div>
            <p class="text-xs font-extrabold uppercase tracking-[.18em] text-lap-muted">Secure Access</p>
            <h2 class="mt-3 text-3xl font-extrabold text-lap-ink">Login</h2>
            <p class="mt-2 text-sm leading-6 text-lap-muted">Enter your account details to continue to the dashboard.</p>
          </div>

          <form id="loginForm" class="mt-7">
            <label class="block text-xs font-extrabold uppercase tracking-[.16em] text-lap-muted" for="email">Email Address</label>
            <div class="mt-2 flex h-12 items-center gap-3 rounded-xl border border-lap-line bg-[#F7F5F7] px-4 transition focus-within:border-lap-purple focus-within:bg-white">
              <i data-lucide="mail" class="h-4 w-4 text-lap-muted"></i>
              <input id="email" class="w-full bg-transparent text-sm font-semibold text-lap-ink outline-none placeholder:text-lap-muted/50" type="email" placeholder="Email address" required>
            </div>

            <label class="mt-5 block text-xs font-extrabold uppercase tracking-[.16em] text-lap-muted" for="password">Password</label>
            <div class="mt-2 flex h-12 items-center gap-3 rounded-xl border border-lap-line bg-[#F7F5F7] px-4 transition focus-within:border-lap-purple focus-within:bg-white">
              <i data-lucide="lock" class="h-4 w-4 text-lap-muted"></i>
              <input id="password" class="w-full bg-transparent text-sm font-semibold text-lap-ink outline-none placeholder:text-lap-muted/50" type="password" placeholder="Password" required>
            </div>

            <p id="loginError" class="mt-3 hidden text-xs font-semibold text-red-600">Please enter both email and password.</p>

            <button class="login-primary mt-7 h-12 w-full rounded-xl text-sm font-extrabold transition" type="submit">Login</button>
            <a class="login-secondary mt-3 inline-flex h-12 w-full items-center justify-center rounded-xl border border-lap-line bg-white text-sm font-bold text-lap-ink transition" href="index.html">Back to Landing Page</a>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const loginForm = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!email.value.trim() || !password.value.trim()) {
        loginError.classList.remove('hidden');
        return;
      }

      window.location.href = 'admin-dashboard.html';
    });

    [email, password].forEach((input) => {
      input.addEventListener('input', () => loginError.classList.add('hidden'));
    });
  </script>
</body>
</html>
