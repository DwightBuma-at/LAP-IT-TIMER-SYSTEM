<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAP IT | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lap: {
              purple: '#3B178F',
              dark: '#27105F',
              light: '#EEE9FA',
              ink: '#050505',
              muted: '#68636C',
              line: '#DED9E0'
            }
          },
          fontFamily: {
            display: ['Barlow Condensed', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #F7F5F7;
      color: #050505;
    }

    .sidebar-link {
      color: #050505;
      font-weight: 400;
      transition: background .2s ease, color .2s ease;
    }

    .sidebar-link:hover {
      background: #EEE9FA;
      color: #3B178F;
    }

    .sidebar-link.active {
      background: #EEE9FA;
      color: #3B178F;
      font-weight: 400;
    }

    .admin-sidebar,
    .admin-main,
    .sidebar-text,
    .sidebar-label,
    .status-panel,
    .user-details {
      transition: all .22s ease;
    }

    body.sidebar-collapsed .admin-sidebar {
      width: 116px;
      padding-left: 12px;
      padding-right: 12px;
    }

    body.sidebar-collapsed .admin-main {
      padding-left: 116px;
    }

    body.sidebar-collapsed .sidebar-text,
    body.sidebar-collapsed .sidebar-label,
    body.sidebar-collapsed .status-panel,
    body.sidebar-collapsed .user-details {
      display: none;
    }

    body.sidebar-collapsed .sidebar-link {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    body.sidebar-collapsed .sidebar-user {
      justify-content: center;
      border: 0;
      padding: 0;
      box-shadow: none;
    }

    body.sidebar-collapsed .sidebar-logout {
      display: none;
    }

    body.sidebar-collapsed .sidebar-toggle-icon {
      transform: rotate(180deg);
    }

    body.sidebar-collapsed .sidebar-header {
      flex-direction: row;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
    }

    body.sidebar-collapsed .sidebar-logo-box {
      width: 64px;
      height: 56px;
      overflow: visible;
      justify-content: center;
      flex-shrink: 0;
    }

    body.sidebar-collapsed .sidebar-logo {
      width: 64px;
      height: 56px;
      object-fit: contain;
      object-position: center;
      max-width: none;
    }

    body.sidebar-collapsed .sidebar-toggle {
      width: 30px;
      height: 36px;
      flex-shrink: 0;
    }

    .mobile-sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      border: 0;
      background: rgba(5, 5, 5, .38);
      backdrop-filter: blur(2px);
    }

    @media (max-width: 767px) {
      .admin-main,
      body.sidebar-collapsed .admin-main {
        padding-left: 0 !important;
      }

      body.mobile-sidebar-open .admin-sidebar {
        display: flex !important;
        width: min(82vw, 280px);
        max-width: 280px;
        z-index: 50;
      }

      body.mobile-sidebar-open .mobile-sidebar-backdrop {
        display: block;
      }
    }

    .logout-dialog,
    .logout-dialog h2,
    .logout-dialog p,
    .logout-dialog button {
      color: #050505;
    }

    .logout-dialog .logout-confirm {
      color: #ffffff;
    }

    .modal-cancel {
      background: #ffffff;
      border: 1px solid #DED9E0;
      color: #050505;
    }

    .modal-cancel:hover {
      background: #EEE9FA;
    }

    .modal-logout {
      background: #DC2626;
      color: #ffffff;
    }

    .modal-logout:hover {
      background: #B91C1C;
    }

    /* Contrast guard: prevent invisible light text on white surfaces. */
    .bg-white,
    .bg-white h1,
    .bg-white h2,
    .bg-white h3,
    .bg-white h4,
    .bg-white p,
    .bg-white label,
    .bg-white span,
    .bg-white strong,
    .bg-white td,
    .bg-white th,
    .bg-white input,
    .bg-white textarea,
    .bg-white select,
    .logout-dialog,
    .logout-dialog * {
      color: #050505 !important;
    }

    .bg-white .text-lap-muted,
    .bg-white .table-muted,
    .bg-white [class*="text-lap-muted"],
    .bg-white input::placeholder,
    .bg-white textarea::placeholder {
      color: #68636C !important;
    }

    .bg-white .text-lap-purple,
    .bg-white [class*="text-lap-purple"] {
      color: #3B178F !important;
    }

    .bg-white .text-emerald-600,
    .bg-white [class*="text-emerald-600"] {
      color: #059669 !important;
    }

    .bg-white .text-blue-600,
    .bg-white [class*="text-blue-600"] {
      color: #2563EB !important;
    }

    .bg-white .text-amber-600,
    .bg-white [class*="text-amber-600"] {
      color: #D97706 !important;
    }

    .bg-white .text-red-600,
    .bg-white [class*="text-red-600"] {
      color: #DC2626 !important;
    }

    button.bg-lap-purple,
    a.bg-lap-purple,
    .bg-white button.bg-lap-purple,
    .bg-white a.bg-lap-purple,
    .message-submit,
    .modal-logout,
    .logout-confirm {
      color: #FFFFFF !important;
    }

    button.bg-lap-dark,
    a.bg-lap-dark,
    button.bg-red-600,
    a.bg-red-600 {
      color: #FFFFFF;
    }

  </style>
</head>
<body>
  <div class="flex min-h-screen">
    <aside id="adminSidebar" class="admin-sidebar fixed inset-y-0 left-0 z-40 flex w-[260px] flex-col border-r border-lap-line bg-white px-5 py-6 shadow-[8px_0_30px_rgba(39,16,95,.04)] max-md:hidden">
      <div class="sidebar-header flex items-center justify-between gap-3">
        <a href="index.html" aria-label="LAP IT home">
          <span class="sidebar-logo-box inline-flex h-16 w-24 items-center justify-start overflow-hidden rounded-2xl bg-transparent">
            <img src="assets/lap_it_logo-removebg-preview.png" alt="LAP IT logo" class="sidebar-logo h-20 w-32 max-w-none object-contain object-left">
          </span>
        </a>
        <button id="toggleSidebar" class="sidebar-toggle inline-flex h-9 w-9 items-center justify-center rounded-xl text-lap-muted transition hover:bg-lap-light hover:text-lap-purple" type="button" aria-label="Toggle sidebar" aria-expanded="true">
          <i data-lucide="chevron-left" class="sidebar-toggle-icon h-5 w-5 transition-transform"></i>
        </button>
      </div>

      <nav class="mt-6 grid gap-2 text-sm" aria-label="Admin modules">
        <p class="sidebar-label mb-2 px-2 text-[11px] font-extrabold uppercase tracking-[.18em] text-lap-muted/70">Admin Tools</p>
        <a class="sidebar-link active flex items-center gap-3 rounded-xl px-4 py-3.5" href="billiard-table-timer.html">
          <i data-lucide="timer" class="h-5 w-5 shrink-0"></i>
          <span class="sidebar-text">Billiard Table Timer</span>
        </a>
        <a class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3.5" href="videoke-room-timer.html">
          <i data-lucide="mic-2" class="h-5 w-5 shrink-0"></i>
          <span class="sidebar-text">Videoke Room Timer</span>
        </a>
        <a class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3.5" href="cashier-dashboard.html">
          <i data-lucide="layout-dashboard" class="h-5 w-5 shrink-0"></i>
          <span class="sidebar-text">Cashier Dashboard</span>
        </a>
        <a class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3.5" href="basic-pos.html">
          <i data-lucide="receipt-text" class="h-5 w-5 shrink-0"></i>
          <span class="sidebar-text">Basic POS</span>
        </a>
        <a class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3.5" href="reports.html">
          <i data-lucide="bar-chart-3" class="h-5 w-5 shrink-0"></i>
          <span class="sidebar-text">Reports</span>
        </a>
      </nav>

      <div class="mt-auto border-t border-lap-line pt-5">
        <div class="sidebar-user flex items-center gap-3 rounded-2xl border border-lap-line bg-white p-3 shadow-sm">
          <span class="inline-flex h-11 w-11 items-center justify-center overflow-hidden rounded-full border-2 border-lap-line bg-white shadow-sm"><img src="assets/lap_it_logo-removebg-preview.png" alt="LAP IT logo" class="h-9 w-9 object-contain"></span>
          <div class="user-details min-w-0">
            <p class="truncate text-sm font-extrabold text-lap-ink">Admin</p>
            <p class="mt-1 inline-flex rounded bg-[#E8E6EB] px-2 py-0.5 text-[10px] font-bold text-lap-muted">Admin</p>
          </div>
          <button id="logoutButton" class="sidebar-logout ml-auto inline-flex h-9 w-9 items-center justify-center rounded-lg text-lap-muted transition hover:bg-lap-light hover:text-lap-purple" type="button" aria-label="Logout">
            <i data-lucide="log-out" class="h-5 w-5"></i>
          </button>
        </div>
      </div>
    </aside>

    <main id="adminMain" class="admin-main min-h-screen flex-1 pl-[260px] max-md:pl-0">
      <header class="sticky top-0 z-30 hidden border-b border-lap-line bg-white/95 px-5 py-4 backdrop-blur max-md:block">
        <div class="flex items-center justify-between">
          <img src="assets/lap_it_logo-removebg-preview.png" alt="LAP IT logo" class="h-12 w-32 object-contain object-left">
          <button class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-lap-line text-lap-purple transition hover:border-lap-purple hover:bg-lap-light" type="button" aria-label="Open menu">
            <i data-lucide="menu" class="h-5 w-5"></i>
          </button>
        </div>
      </header>

      <section class="min-h-screen px-8 py-8 sm:px-10 lg:px-12"></section>
    </main>
  </div>

  <div id="logoutModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/45 px-5 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
    <div class="logout-dialog w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-[0_24px_60px_rgba(0,0,0,.24)]">
      <span class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-lap-light text-lap-purple">
        <i data-lucide="log-out" class="h-7 w-7"></i>
      </span>
      <h2 id="logoutTitle" class="mt-5 text-xl font-extrabold text-lap-ink">Confirm Logout</h2>
      <p class="mt-3 text-sm leading-6 text-lap-muted">Are you sure you want to logout from the admin dashboard?</p>
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button id="cancelLogout" class="modal-cancel h-11 rounded-xl text-sm font-bold transition" type="button">Cancel</button>
        <a class="modal-logout inline-flex h-11 items-center justify-center rounded-xl text-sm font-bold transition" href="index.html">Logout</a>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const toggleSidebar = document.getElementById('toggleSidebar');
    const logoutButton = document.getElementById('logoutButton');
    const logoutModal = document.getElementById('logoutModal');
    const cancelLogout = document.getElementById('cancelLogout');
    const mobileMenuButton = document.querySelector('button[aria-label="Open menu"]');
    const mobileSidebarBackdrop = document.createElement('button');
    mobileSidebarBackdrop.className = 'mobile-sidebar-backdrop';
    mobileSidebarBackdrop.type = 'button';
    mobileSidebarBackdrop.setAttribute('aria-label', 'Close menu');
    document.body.appendChild(mobileSidebarBackdrop);

    const openMobileSidebar = () => {
      document.body.classList.remove('sidebar-collapsed');
      document.body.classList.add('mobile-sidebar-open');
      mobileMenuButton?.setAttribute('aria-expanded', 'true');
    };

    const closeMobileSidebar = () => {
      document.body.classList.remove('mobile-sidebar-open');
      mobileMenuButton?.setAttribute('aria-expanded', 'false');
    };

    mobileMenuButton?.addEventListener('click', openMobileSidebar);
    mobileSidebarBackdrop.addEventListener('click', closeMobileSidebar);
    document.querySelectorAll('#adminSidebar a').forEach((link) => {
      link.addEventListener('click', closeMobileSidebar);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) closeMobileSidebar();
    });

    toggleSidebar.addEventListener('click', () => {
      const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
      toggleSidebar.setAttribute('aria-expanded', String(!isCollapsed));
    });

    logoutButton.addEventListener('click', () => {
      logoutModal.classList.remove('hidden');
      logoutModal.classList.add('flex');
    });

    cancelLogout.addEventListener('click', () => {
      logoutModal.classList.add('hidden');
      logoutModal.classList.remove('flex');
    });

    logoutModal.addEventListener('click', (event) => {
      if (event.target === logoutModal) {
        logoutModal.classList.add('hidden');
        logoutModal.classList.remove('flex');
      }
    });
  </script>
</body>
</html>
